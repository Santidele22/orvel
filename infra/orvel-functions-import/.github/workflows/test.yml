name: Tests

on:
  push:
    branches: [main, feat/orvel-mp-backend-gating]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.x"
      - name: Run tests
        run: deno test --allow-env supabase/functions/_shared/mp-subscription-guards.test.ts