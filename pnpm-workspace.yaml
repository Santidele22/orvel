packages:
  - apps/landing
  - apps/dashboard
  - apps/shared/*
  - packages/*

overrides:
  brace-expansion: 5.0.6
  esbuild: 0.28.1
  form-data: 4.0.6
  js-yaml: 4.2.0
  path-to-regexp: 6.3.0
  tar: 7.5.16
  vite: 7.3.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true

# apps/dashboard keeps Bun support for local development, while Vercel/root builds
# install its dependencies through the pnpm workspace.
