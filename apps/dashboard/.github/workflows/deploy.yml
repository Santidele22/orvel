name: Deploy Supabase Edge Functions

on:
  push:
    branches: [dev]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy mercadopago-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy create-subscription --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy change-subscription --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy cancel-subscription --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy appointment-reminders-24h --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
