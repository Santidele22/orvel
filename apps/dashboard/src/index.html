<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Orvel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orvel">
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="/dashboard/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- Consolidated Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .glass-panel {
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }

    /* Legacy Zen typography mappings */
    .zen-font-micro {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .zen-font-body {
      font-size: 14px;
      font-weight: 400;
    }

    .zen-font-title {
      font-size: 18px;
      font-weight: 600;
    }

    /* Global tightening */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      line-height: 1.1;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body class="antialiased bg-bg-primary text-text-primary">
  <script>
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__ORVEL_DEFERRED_INSTALL_PROMPT = event;
    });
  </script>
  <app-root></app-root>
</body>

</html>
