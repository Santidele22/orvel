<div class="login-container">
  <div class="login-card">
    <header class="login-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M20 10 L20 30 M10 20 L30 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Turnea</span>
      </div>
      <h1 class="login-title">Redirigiendo a Orvel</h1>
      <p class="login-subtitle">El acceso se gestiona desde el login unificado.</p>
    </header>

    <a class="submit-button" [href]="redirectUrl">
      <span>Ir al login unificado</span>
      <i class="ri-arrow-right-line"></i>
    </a>

    <!-- Footer Links -->
    <footer class="login-footer">
      <span class="footer-link">Sin credenciales en el dashboard</span>
    </footer>
  </div>

  <!-- Background Decoration -->
  <div class="background-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>
</div>
