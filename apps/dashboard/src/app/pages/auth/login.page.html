<!-- Login Page - Credentials Only for Existing Users -->
<!-- No plan selection, no business-type selection -->

<div class="login-container">
  <div class="login-card">
    <!-- Logo / Brand -->
    <header class="login-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
          <path d="M20 10 L20 30 M10 20 L30 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Turnea</span>
      </div>
      <h1 class="login-title">Iniciar sesión</h1>
      <p class="login-subtitle">Accedé a tu cuenta de gestión</p>
    </header>

    <!-- Error Alert -->
    @if (formError) {
      <div class="error-alert" role="alert">
        <i class="ri-error-warning-line"></i>
        <span>{{ formError }}</span>
      </div>
    }

    <!-- Login Form -->
    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Email Field -->
      <div class="form-field" [class.has-error]="emailError">
        <label for="email" class="form-label">Email</label>
        <div class="input-wrapper">
          <i class="ri-mail-line input-icon"></i>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="tu@email.com"
            [value]="email"
            (input)="onEmailChange($any($event.target).value)"
            autocomplete="email"
            required
          />
        </div>
        @if (emailError) {
          <p class="field-error">{{ emailError }}</p>
        }
      </div>

      <!-- Password Field -->
      <div class="form-field" [class.has-error]="passwordError">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="ri-lock-line input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            class="form-input"
            placeholder="Tu contraseña"
            [value]="password"
            (input)="onPasswordChange($any($event.target).value)"
            autocomplete="current-password"
            required
            minlength="6"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
          </button>
        </div>
        @if (passwordError) {
          <p class="field-error">{{ passwordError }}</p>
        }
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="submit-button"
        [class.is-loading]="isLoading"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <span class="spinner"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Iniciar sesión</span>
          <i class="ri-arrow-right-line"></i>
        }
      </button>
    </form>

    <!-- Footer Links -->
    <footer class="login-footer">
      <a href="#" class="footer-link">¿Olvidaste tu contraseña?</a>
    </footer>
  </div>

  <!-- Background Decoration -->
  <div class="background-decoration">
    <div class="decoration-circle circle-1"></div>
    <div class="decoration-circle circle-2"></div>
    <div class="decoration-circle circle-3"></div>
  </div>
</div>
