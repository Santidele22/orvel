<div class="relative hidden lg:block">
  <ng-container *ngComponentOutlet="activeTemplate().topbarComponent; inputs: templateInputs()" />
</div>

<div class="sr-only">
  <div class="dashboard-topbar-contract hidden lg:block" data-testid="dashboard-topbar-responsive">
    <button
      type="button"
      data-testid="dashboard-topbar-notifications"
      aria-label="Abrir notificaciones"
      class="focus-visible:outline-none focus-visible:ring-(--zen-size-icon-sm) focus-visible:ring-(--focus-ring)"
    >
      <i class="ri-notification-3-line" aria-hidden="true"></i>
      Notificaciones
    </button>
  </div>
</div>
