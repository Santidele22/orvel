<div class="calendar-container animate-in fade-in duration-500">
  <div class="calendar-header flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-primary-soft flex items-center justify-center text-primary shadow-sm ring-1 ring-primary/10">
        <i class="ri-calendar-2-line text-lg"></i>
      </div>
      <div>
        <h3 class="text-sm font-bold text-text-primary capitalize leading-tight">{{ monthLabel() }}</h3>
        <p class="text-[10px] font-medium text-text-tertiary uppercase tracking-wider">Planificador Semanal</p>
      </div>
    </div>
    
    <div class="flex items-center gap-1 bg-surface-muted p-1 rounded-xl border border-border">
      <button (click)="prevWeek()" 
              class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface text-text-secondary hover:text-primary transition-all">
        <i class="ri-arrow-left-s-line"></i>
      </button>
      <button (click)="goToToday()" 
              class="px-3 h-8 text-[10px] font-bold uppercase tracking-wider text-text-tertiary hover:text-primary transition-all">
        {{ navigatorLabel() }}
      </button>
      <button (click)="nextWeek()" 
              class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface text-text-secondary hover:text-primary transition-all">
        <i class="ri-arrow-right-s-line"></i>
      </button>
    </div>
  </div>

  <div class="calendar-days grid grid-cols-7 gap-2">
    @for (day of calendarDays(); track day.toISOString()) {
      <button 
        (click)="selectDate(day)"
        [class]="'day-button flex flex-col items-center py-3 px-2 rounded-2xl transition-all duration-300 group ' + 
                 (isSelected(day) ? 'selected scale-105 shadow-md ring-2 ring-primary/20' : 'hover:bg-primary-soft/30 hover:scale-[1.02]')">
        
        <span [class]="'text-[9px] font-bold uppercase tracking-widest mb-1 transition-colors ' + 
                        (isSelected(day) ? 'text-primary' : 'text-text-tertiary group-hover:text-text-secondary')">
          {{ day.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '') }}
        </span>
        
        <span [class]="'text-sm font-black leading-none transition-all ' + 
                        (isSelected(day) ? 'text-primary scale-110' : 'text-text-secondary group-hover:text-text-primary')">
          {{ day.getDate() }}
        </span>
        
        @if (isToday(day) && !isSelected(day)) {
          <div class="mt-1.5 w-1 h-1 rounded-full bg-accent animate-pulse"></div>
        }
      </button>
    }
  </div>
</div>
