name: Booking regression gate

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - fix/public-booking-regressions-dev

permissions:
  contents: read

jobs:
  dashboard-booking-regressions:
    name: Dashboard booking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run booking regression contracts
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/unit/public-booking-settings-sync.contract.spec.ts src/app/tests/unit/dashboard-notifications-business-scope.contract.spec.ts src/app/tests/integration/booking-email-lifecycle.contract.spec.ts

      - name: Run branch booking resilience contract
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/integration/dashboard-branch-booking-resilience.contract.spec.ts

      - name: Run dashboard corrective action contracts
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/unit/dashboard-corrective-actions-ui.contract.spec.ts src/app/tests/unit/dashboard-service-actions-behavior.contract.spec.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run public booking Supabase reliability regression
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/public-booking-reliability-regression.test.ts

      - name: Run business schema cleanup static contract
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/business-schema-cleanup-static-contract.test.ts

      - name: Run booking time schema cleanup static contract
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/booking-time-schema-cleanup-static-contract.test.ts

      - name: Run booking billing subscription payments regression
        run: deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/subscription-payments-contract.test.ts

      - name: Reject focused Deno tests
        run: |
          if grep -RIn --include='*.ts' 'Deno\.test\.only' supabase/functions; then
            echo "Committed Deno.test.only is not allowed under supabase/functions." >&2
            exit 1
          fi

      - name: Run focused P0 public booking Supabase contracts
        run: |
          deno test --allow-read --config supabase/functions/deno.json supabase/functions/_shared/p0-public-booking-static-contracts.test.ts

      - name: Typecheck dashboard app
        run: pnpm --dir apps/dashboard exec tsc -p tsconfig.app.json --noEmit
