name: Booking regression gate

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - fix/public-booking-regressions-dev

permissions:
  contents: read

jobs:
  dashboard-booking-regressions:
    name: Dashboard booking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run booking regression contracts
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/unit/public-booking-settings-sync.contract.spec.ts src/app/tests/unit/dashboard-notifications-business-scope.contract.spec.ts src/app/features/booking/pages/public/manage-booking-m6-public-reschedule.red.contract.spec.ts src/app/tests/integration/booking-email-lifecycle.contract.spec.ts

      - name: Run branch booking resilience contract
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/integration/dashboard-branch-booking-resilience.contract.spec.ts

      - name: Typecheck dashboard app
        run: pnpm --dir apps/dashboard exec tsc -p tsconfig.app.json --noEmit
