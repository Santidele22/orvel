name: Booking regression gate

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - fix/public-booking-regressions-dev

permissions:
  contents: read

jobs:
  dashboard-booking-regressions:
    name: Dashboard booking regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run booking regression contracts
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/unit/public-booking-settings-sync.contract.spec.ts src/app/tests/unit/dashboard-notifications-business-scope.contract.spec.ts src/app/features/booking/pages/public/manage-booking-m6-public-reschedule.red.contract.spec.ts

      - name: Run branch booking resilience contract
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/integration/dashboard-branch-booking-resilience.contract.spec.ts

      - name: Run dashboard corrective action contracts
        run: pnpm --dir apps/dashboard exec vitest run src/app/tests/unit/dashboard-corrective-actions-ui.contract.spec.ts src/app/tests/unit/dashboard-service-actions-behavior.contract.spec.ts

      - name: Outbox grep guard
        run: |
          set -o pipefail
          if grep -rn -E 'notification_email_outbox|email_outbox' \
               apps/ supabase/functions/ \
               --include='*.ts' --include='*.tsx' --include='*.astro' \
               --exclude='*.spec.ts' --exclude='*.test.ts' \
               | grep -v 'apps/dashboard/supabase/migrations/'; then
            echo "::error::Outbox references found in runtime code; c2 cleanup incomplete"
            exit 1
          fi

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run public booking Supabase reliability regression
        run: echo "Skipped: supabase/functions/_shared/public-booking-reliability-regression.test.ts (legacy contract after 2.0 cleanup)"

      - name: Run business schema cleanup static contract
        run: echo "Skipped: supabase/functions/_shared/business-schema-cleanup-static-contract.test.ts (legacy contract after 2.0 cleanup)"

      - name: Run booking time schema cleanup static contract
        run: echo "Skipped: supabase/functions/_shared/booking-time-schema-cleanup-static-contract.test.ts (legacy contract after 2.0 cleanup)"

      - name: Run booking billing subscription payments regression
        # subscription-payments-contract.test.ts removed in 2.0 cleanup PR-1 — module deleted
        run: echo "Skipped: legacy subscription payments contract removed in 2.0 cleanup PR-1"

      - name: Reject focused Deno tests
        run: |
          if grep -RIn --include='*.ts' 'Deno\.test\.only' supabase/functions; then
            echo "Committed Deno.test.only is not allowed under supabase/functions." >&2
            exit 1
          fi

      - name: Run focused P0 public booking Supabase contracts
        run: echo "Skipped: supabase/functions/_shared/p0-public-booking-static-contracts.test.ts (legacy contract after 2.0 cleanup)"

      - name: Typecheck dashboard app
        run: pnpm --dir apps/dashboard exec tsc -p tsconfig.app.json --noEmit
