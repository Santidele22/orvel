name: Promotion drift guard

on:
  pull_request:
    branches: [qa, main]

permissions:
  contents: read

jobs:
  migration-drift-guard:
    name: Migration drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # fetch the promotion base branch and the PR head commit explicitly
      - name: Fetch promotion base and PR head
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"

      - name: Check migration drift
        run: node scripts/check-migration-drift.mjs --base origin/${{ github.base_ref }} --head origin/pr-head
