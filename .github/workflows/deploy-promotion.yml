name: Deploy promotion

on:
  push:
    branches:
      - qa
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'orvel-prod' || 'orvel-qa' }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "supabase_ref=${{ secrets.SUPABASE_PROJECT_REF_QA }}" >> $GITHUB_OUTPUT
            echo "vercel_args=" >> $GITHUB_OUTPUT
            echo "vercel_alias=qa.orvel.pro" >> $GITHUB_OUTPUT
            echo "console_alias=dashboard.qa.orvel.pro" >> $GITHUB_OUTPUT
            echo "function_environment=qa" >> $GITHUB_OUTPUT
            echo "landing_url=https://qa.orvel.pro" >> $GITHUB_OUTPUT
            echo "dashboard_url=https://qa.orvel.pro" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "supabase_ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> $GITHUB_OUTPUT
            echo "vercel_args=--prod" >> $GITHUB_OUTPUT
            echo "vercel_alias=" >> $GITHUB_OUTPUT
            echo "console_alias=dashboard.orvel.pro" >> $GITHUB_OUTPUT
            echo "function_environment=production" >> $GITHUB_OUTPUT
            echo "landing_url=https://orvel.pro" >> $GITHUB_OUTPUT
            echo "dashboard_url=https://orvel.pro" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: ${{ github.ref }}" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase link --project-ref ${{ steps.target.outputs.supabase_ref }}

      # ADR 0012 — the handoff allowlist has to know which environment it is serving: production
      # allows the three production origins, qa its own three, and only an unset value means the
      # local stack. Nothing used to set this, so every deployed function also allowed the six
      # localhost origins. The value lives here, in the repository, instead of only in the
      # Supabase project settings where it cannot be reviewed.
      - name: Declare the function runtime environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase secrets set ENVIRONMENT=${{ steps.target.outputs.function_environment }}

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase db push

      - name: Deploy process-email-outbox
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy process-email-outbox --project-ref ${{ steps.target.outputs.supabase_ref }}

      - name: Deploy release-expired-booking-holds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy release-expired-booking-holds --project-ref ${{ steps.target.outputs.supabase_ref }}

      - name: Deploy operator-lifecycle-pushes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy operator-lifecycle-pushes --project-ref ${{ steps.target.outputs.supabase_ref }}

      - name: Deploy account-closure
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy account-closure --project-ref ${{ steps.target.outputs.supabase_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark deploy as the pushed git branch
        run: git switch -C ${{ github.ref_name }}

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(npx vercel@59.11.7 deploy --token "$VERCEL_TOKEN" --yes ${{ steps.target.outputs.vercel_args }} --build-env PUBLIC_LANDING_URL=${{ steps.target.outputs.landing_url }} --build-env PUBLIC_DASHBOARD_URL=${{ steps.target.outputs.dashboard_url }})
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ steps.target.outputs.vercel_alias }}" ]]; then
            npx vercel@59.11.7 alias "$URL" "${{ steps.target.outputs.vercel_alias }}" --token "$VERCEL_TOKEN"
          fi

      # ADR 0012 / Fase 4 of #1098 — the operator console is its own origin and its own Vercel
      # project, so it deploys from its own project id. The project's build command must be
      # `pnpm run build:vercel:web`, which emits the standalone artifact at the repository root.
      #
      # Until `VERCEL_PROJECT_ID_WEB` exists this step reports the skip instead of failing, so a
      # promotion is never blocked by infrastructure that has not been created yet.
      - name: Deploy the operator console to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CONSOLE_ALIAS: ${{ steps.target.outputs.console_alias }}
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "Skipping the console deploy: VERCEL_PROJECT_ID_WEB is not configured (ADR 0012 step 1)."
            exit 0
          fi
          URL=$(npx vercel@59.11.7 deploy --token "$VERCEL_TOKEN" --yes ${{ steps.target.outputs.vercel_args }} --build-env PUBLIC_LANDING_URL=${{ steps.target.outputs.landing_url }})
          npx vercel@59.11.7 alias "$URL" "$CONSOLE_ALIAS" --token "$VERCEL_TOKEN"
