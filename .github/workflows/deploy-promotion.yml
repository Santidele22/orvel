name: Deploy promotion

on:
  push:
    branches:
      - qa
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'orvel-prod' || 'orvel-qa' }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "supabase_ref=${{ secrets.SUPABASE_PROJECT_REF_QA }}" >> $GITHUB_OUTPUT
            echo "vercel_args=" >> $GITHUB_OUTPUT
            echo "vercel_alias=qa.orvel.pro" >> $GITHUB_OUTPUT
            echo "angular_config=production" >> $GITHUB_OUTPUT
            echo "site=combined" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "supabase_ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> $GITHUB_OUTPUT
            echo "vercel_args=--prod" >> $GITHUB_OUTPUT
            echo "vercel_alias=" >> $GITHUB_OUTPUT
            echo "angular_config=production" >> $GITHUB_OUTPUT
            echo "site=combined" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch: ${{ github.ref }}" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase link --project-ref ${{ steps.target.outputs.supabase_ref }}

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase db push

      - name: Deploy process-email-outbox
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy process-email-outbox --project-ref ${{ steps.target.outputs.supabase_ref }}

      - name: Deploy release-expired-booking-holds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SUPABASE_ACCESS_TOKEN_PROD || secrets.SUPABASE_ACCESS_TOKEN_QA }}
        run: supabase functions deploy release-expired-booking-holds --project-ref ${{ steps.target.outputs.supabase_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark combined QA deploy as git branch qa
        if: ${{ steps.target.outputs.site == 'combined' && github.ref == 'refs/heads/qa' }}
        run: git switch -C qa

      - name: Build dashboard
        if: ${{ steps.target.outputs.site == 'dashboard' }}
        run: pnpm --dir apps/dashboard exec ng build --configuration=${{ steps.target.outputs.angular_config }}

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.target.outputs.site }}" == "combined" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              URL=$(npx vercel@59.11.7 deploy --token "$VERCEL_TOKEN" --yes --prod --build-env PUBLIC_LANDING_URL=https://orvel.pro --build-env PUBLIC_DASHBOARD_URL=https://orvel.pro)
            else
              URL=$(npx vercel@59.11.7 deploy --token "$VERCEL_TOKEN" --yes --build-env PUBLIC_LANDING_URL=https://qa.orvel.pro --build-env PUBLIC_DASHBOARD_URL=https://qa.orvel.pro)
            fi
          else
            OUT=apps/dashboard/dist/salon-de-belleza/browser
            printf '%s\n' '{"rewrites":[{"source":"/(.*)","destination":"/index.html"}]}' > "$OUT/vercel.json"
            URL=$(npx vercel@59.11.7 deploy "$OUT" ${{ steps.target.outputs.vercel_args }} --token "$VERCEL_TOKEN" --yes)
          fi
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ steps.target.outputs.vercel_alias }}" ]]; then
            npx vercel@59.11.7 alias "$URL" "${{ steps.target.outputs.vercel_alias }}" --token "$VERCEL_TOKEN"
          fi
