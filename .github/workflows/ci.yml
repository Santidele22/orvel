name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "apps/dashboard/**"
      - "apps/landing/**"
      - "supabase/**"
      - "docs/runbooks/supabase-migrations.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard typecheck/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: bun run build

  landing:
    name: Landing build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  supabase-migrations:
    name: Supabase migration status note
    runs-on: ubuntu-latest
    steps:
      - name: Document current Supabase CI posture
        run: |
          cat <<'EOF'
          Supabase migration validation is intentionally manual for the first CI pass.
          Reason: remote migration history mismatch is known, and DB push/repair is not allowed in CI.
          Runbook: docs/runbooks/supabase-migrations.md
          Future non-blocking check can run `supabase migration list` only when project ref and token are available.
          EOF
