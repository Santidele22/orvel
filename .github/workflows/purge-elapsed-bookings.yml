name: Purge elapsed bookings scheduler

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: purge-elapsed-bookings-scheduler
  cancel-in-progress: false

jobs:
  invoke-purge-elapsed-bookings:
    name: Invoke purge-elapsed-bookings Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge elapsed bookings
        env:
          PURGE_ELAPSED_BOOKINGS_FUNCTION_URL: ${{ secrets.PURGE_ELAPSED_BOOKINGS_FUNCTION_URL }}
          PURGE_ELAPSED_BOOKINGS_CRON_SECRET: ${{ secrets.PURGE_ELAPSED_BOOKINGS_CRON_SECRET }}
        run: |
          if [ -z "$PURGE_ELAPSED_BOOKINGS_FUNCTION_URL" ] || [ -z "$PURGE_ELAPSED_BOOKINGS_CRON_SECRET" ]; then
            echo "Purge elapsed bookings scheduler secrets are not configured."
            exit 1
          fi

          curl --fail --show-error --silent --output /dev/null \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --retry-max-time 180 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${PURGE_ELAPSED_BOOKINGS_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$PURGE_ELAPSED_BOOKINGS_FUNCTION_URL"
